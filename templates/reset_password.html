<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reset Password — GreenField</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"/>
  <style>
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#071f09 0%,#1B5E20 45%,#43A047 100%);padding:20px;position:relative;overflow:hidden}
    body::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:rgba(255,255,255,.03);top:-200px;right:-200px;pointer-events:none}
    body::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.03);bottom:-150px;left:-100px;pointer-events:none}
    .auth-card{background:#fff;border-radius:20px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.3);position:relative;z-index:1;overflow:visible}
    .auth-top{border-radius:20px 20px 0 0;overflow:hidden;background:linear-gradient(135deg,#1B5E20,#43A047);padding:36px 36px 28px;text-align:center;color:#fff}
    .auth-logo{width:60px;height:60px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
    .auth-top h1{font-size:22px;font-weight:800;margin-bottom:4px}
    .auth-top p{font-size:13px;opacity:.75}
    .auth-body{padding:28px 32px 32px}
    .auth-flash{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:9px}
    .auth-flash.error{background:#FEF2F2;color:#991B1B;border-left:3px solid #EF4444}
    .auth-flash.success{background:#ECFDF5;color:#065F46;border-left:3px solid #10B981}
    .auth-body .form-group{margin-bottom:16px}
    .auth-body label{display:block;font-size:12.5px;font-weight:700;color:#2E7D32;margin-bottom:5px}
    .input-wrap{position:relative}
    .input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#81C784;font-size:14px}
    .input-wrap .form-control{padding-left:38px}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#9E9E9E;font-size:14px;background:none;border:none;padding:0}
    .pw-toggle:hover{color:#2E7D32}
    .auth-btn{width:100%;padding:12px;background:linear-gradient(135deg,#2E7D32,#43A047);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:6px}
    .auth-btn:hover{background:linear-gradient(135deg,#1B5E20,#2E7D32);transform:translateY(-1px);box-shadow:0 4px 16px rgba(46,125,50,.35)}
    .auth-footer{text-align:center;margin-top:18px;padding:14px 16px;font-size:13.5px;color:#5C7A5C;background:#F0FAF0;border-radius:0 0 20px 20px;border-top:1px solid #C8E6C9}
    .auth-footer a{color:#1B5E20;font-weight:800;text-decoration:none;border-bottom:2px solid #81C784}
    .back-link{position:absolute;top:16px;left:16px;color:rgba(255,255,255,.7);font-size:13px;display:flex;align-items:center;gap:6px;transition:color .2s;z-index:2}
    .back-link:hover{color:#fff}
    /* Password strength bar */
    .pw-strength{margin-top:6px}
    .pw-strength-bar{height:5px;border-radius:99px;background:#E8F5E9;overflow:hidden}
    .pw-strength-bar span{display:block;height:100%;width:0%;border-radius:99px;transition:all .3s}
    .pw-strength-label{font-size:11px;margin-top:4px;font-weight:600}
  </style>
</head>
<body>

<a href="{{ url_for('login') }}" class="back-link">
  <i class="fas fa-arrow-left"></i> Back to Login
</a>

<div class="auth-card">
  <div class="auth-top">
    <div class="auth-logo"><i class="fas fa-lock-open"></i></div>
    <h1>Set New Password</h1>
    <p>Choose a strong new password</p>
  </div>

  <div class="auth-body">

    {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat,msg in msgs %}
    <div class="auth-flash {{ cat }}">
      <i class="fas fa-{{ 'check-circle' if cat=='success' else 'exclamation-circle' }}"></i>
      <span>{{ msg|safe }}</span>
    </div>
    {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>New Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" name="new_password" id="pw1" class="form-control"
                 placeholder="Min. 6 characters" required
                 oninput="checkStrength(this.value)"/>
          <button type="button" class="pw-toggle" onclick="togglePw('pw1','eye1')">
            <i class="fas fa-eye" id="eye1"></i>
          </button>
        </div>
        <div class="pw-strength">
          <div class="pw-strength-bar"><span id="strengthBar"></span></div>
          <div class="pw-strength-label" id="strengthLabel"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" name="confirm_password" id="pw2" class="form-control"
                 placeholder="Repeat new password" required/>
          <button type="button" class="pw-toggle" onclick="togglePw('pw2','eye2')">
            <i class="fas fa-eye" id="eye2"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-btn">
        <i class="fas fa-check-circle"></i> Reset Password
      </button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('login') }}">← Back to Sign In</a>
    </div>
  </div>
</div>

<script>
function togglePw(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon  = document.getElementById(iconId);
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.replace('fa-eye','fa-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.replace('fa-eye-slash','fa-eye');
  }
}

function checkStrength(pw) {
  let score = 0;
  if (pw.length >= 6)  score++;
  if (pw.length >= 10) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const levels = [
    {w:'0%',   c:'#E0E0E0', t:''},
    {w:'20%',  c:'#EF5350', t:'Weak'},
    {w:'40%',  c:'#FF9800', t:'Fair'},
    {w:'60%',  c:'#FDD835', t:'Good'},
    {w:'80%',  c:'#66BB6A', t:'Strong'},
    {w:'100%', c:'#2E7D32', t:'Very Strong 💪'},
  ];
  const lvl = levels[Math.min(score, 5)];
  const bar   = document.getElementById('strengthBar');
  const label = document.getElementById('strengthLabel');
  bar.style.width = lvl.w;
  bar.style.background = lvl.c;
  label.textContent = lvl.t;
  label.style.color = lvl.c;
}
</script>

</body>
</html>
