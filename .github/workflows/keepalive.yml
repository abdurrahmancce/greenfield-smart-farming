# Pings the app every 10 minutes so Render's free instance never falls asleep.
# (Backup for UptimeRobot — either one alone is enough, both together is safest.)
name: Keep Render awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 \
            https://greenfield-smart-farming-1.onrender.com/healthz
