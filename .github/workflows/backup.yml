name: Nightly DB backup
on:
  schedule: [{ cron: "30 20 * * *" }]   # 02:30 Bangladesh time
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump, encrypt, store
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f backup.sql.gz' EXIT
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then echo "Backup configuration missing."; exit 1; fi
          docker run --rm postgres:17 pg_dump --no-owner --no-privileges "$DB_URL" | gzip > backup.sql.gz
          gzip -t backup.sql.gz
          gzip -dc backup.sql.gz | awk 'BEGIN { found=0 } length($0) { found=1 } END { exit !found }'
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "greenfield-$(date +%F).sql.gz.gpg" backup.sql.gz
          rm backup.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: greenfield-*.gpg
          retention-days: 30
          if-no-files-found: error
