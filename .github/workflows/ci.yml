name: CI
on: [push, pull_request]
permissions:
  contents: read          # the tests need nothing more than read access
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest pytest-cov pip-audit
      - name: Tests with coverage (fails if coverage drops below 60%)
        run: python -m pytest -q --cov --cov-report=term --cov-report=markdown:coverage.md --cov-fail-under=60
      - name: Show coverage in the run summary
        if: always()
        run: '[ -f coverage.md ] && cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Known-vulnerability check of dependencies
        run: pip-audit -r requirements.txt
