name: CI
on: [push, pull_request]
permissions:
  contents: read          # the tests need nothing more than read access
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest pytest-cov pip-audit bandit
      - name: Tests with coverage (fails if coverage drops below 60%)
        run: python -m pytest -q --cov --cov-report=term --cov-report=markdown:coverage.md --cov-fail-under=60
      - name: Show coverage in the run summary
        if: always()
        run: '[ -f coverage.md ] && cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Known-vulnerability check of dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan (bandit, medium+ severity)
        # B608 (SQL text built from placeholders) is enforced by tests/test_sql_safety.py instead;
        # B104 (bind 0.0.0.0) is required on Render; B310/B113 are fixed https URLs with timeouts.
        run: bandit -q -r . -x ./tests,./tools,./static,./.git -ll --skip B608,B104,B310,B113
