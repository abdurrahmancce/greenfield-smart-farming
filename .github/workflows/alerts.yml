name: Weather alerts
on:
  schedule: [{ cron: "0 */3 * * *" }]
  workflow_dispatch:
permissions: {}
jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: ${{ secrets.APP_URL }}
          TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then echo "::warning::APP_URL / CRON_TOKEN secrets not set - alerts skipped"; exit 0; fi
          case "$URL" in https://*) ;; *) echo "::error::APP_URL must start with https:// (the token would travel unencrypted)"; exit 1;; esac
          curl -fsS -m 100 -X POST -H "X-Cron-Token: $TOKEN" "$URL/api/cron/alerts"
